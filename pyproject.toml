[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["apps/api/app"]

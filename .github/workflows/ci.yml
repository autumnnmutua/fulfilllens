name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: 静态检查、测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
            tests/requirements.txt

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Python 依赖
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: 检查格式
        run: npm run format:check

      - name: 运行静态检查
        run: npm run lint

      - name: 运行类型检查
        run: npm run typecheck

      - name: 检查依赖漏洞
        run: |
          npm audit --audit-level=high
          python -m pip_audit

      - name: 检查依赖许可证
        run: npm run licenses:check

      - name: 检查发布文档、链接和隐私规则
        run: npm run docs:check

      - name: 运行测试
        run: npm run test

      - name: 构建前端
        run: npm run build

      - name: 验证 Cloudflare 在线预览构建
        run: |
          npm run build:cloudflare
          npx --yes wrangler@4.120.0 deploy --dry-run --outdir dist/cloudflare-worker

      - name: 检查 Docker Compose 配置
        run: docker compose config --quiet

  docker-smoke:
    name: Docker 构建与烟雾测试
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 安装浏览器审计依赖
        run: npm ci

      - name: 检查 Compose 配置
        run: docker compose config --quiet

      - name: 构建并启动服务
        run: docker compose up --build --detach

      - name: 等待 API 与 Web 健康
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: 审计生产网页、移动端与可访问性
        shell: bash
        run: |
          FL_CHROMIUM_PATH="$(command -v google-chrome)" \
          FL_WEB_URL="http://127.0.0.1:5173" \
          FL_AUDIT_OUTPUT="${RUNNER_TEMP}/chromium-audit-results.json" \
          npm run test:browser

      - name: 验证容器运行期只读资产
        run: |
          curl --fail --silent http://127.0.0.1:8000/api/version >/dev/null
          curl --fail --silent http://127.0.0.1:8000/api/cases >/dev/null
          curl --fail --silent http://127.0.0.1:8000/api/diagnostics/rules >/dev/null

      - name: 输出脱敏启动日志
        if: always()
        run: docker compose logs --no-color

      - name: 清理容器和 CI 数据卷
        if: always()
        run: docker compose down --volumes --remove-orphans

name: 功能建议
description: 提议符合本地优先、可解释 MVP 边界的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请从用户问题和可验证价值出发。完整 WMS/TMS/ERP、实时车辆定位、付费快递接口、多租户计费和不可解释模型诊断不属于当前范围。
  - type: dropdown
    id: user
    attributes:
      label: 主要用户
      options:
        - 物流管理专业学生
        - 教师
        - 中小电商商家
        - 开源维护者
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前用户无法完成的任务，不要只写一个技术方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与用户路径
      description: 说明入口、关键操作、输出和空/错状态。
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: 数据、指标或规则影响
      description: 列出字段、公式、分母、状态、阈值、覆盖率、API 或模拟假设；无影响请写“无”。
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 隐私、安全与许可证
      description: 是否引入外部服务、敏感数据、新依赖、许可证、费用或权限？
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 给出可测试、可人工验证的结果和合成样例方案。
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已阅读 PRD、路线图和明确不做事项。
          required: true
        - label: 提议不会要求上传真实订单或个人信息作为公开样例。
          required: true

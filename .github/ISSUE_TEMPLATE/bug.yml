name: Bug 报告
description: 报告可稳定复现的功能、数据、安全、兼容或可访问性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。请只使用合成数据，并先移除日志、截图和文件中的姓名、手机号、地址、身份证、Token 和企业内部信息。安全漏洞请按 SECURITY.md 私密报告。
  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 数据导入与字段映射
        - 指标与分析总览
        - 异常诊断
        - What-if 模拟
        - 教学案例
        - 报告与导出
        - 数据清理与隐私
        - 构建、Docker 或 CI
        - 可访问性或移动端
        - 文档
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 例如 1.0.0-rc.1 或提交哈希
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node/npm、Python、浏览器、Docker 版本和运行方式。
      placeholder: Windows 11；Node 24；Python 3.13；Chromium；本地开发
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净状态开始，给出可重复的最小步骤。
      placeholder: |
        1. 载入案例 A
        2. 打开分析总览
        3. 选择……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请说明错误是否持续保留在页面、是否可重试，以及是否有数据被修改。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志与验收证据
      description: 粘贴最小日志、失败命令或截图说明；不要附真实数据，可附合成复现文件的生成方式。
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已确认复现材料只含合成数据，日志和截图已脱敏。
          required: true
        - label: 我没有删除测试、降低断言或使用静态结果绕过问题。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
